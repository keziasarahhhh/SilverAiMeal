<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SilverMeal AI</title>
  <meta name="description" content="Food expiration tracking and senior group-meal planning for community meal centers and long-term care kitchens.">
  <meta name="theme-color" content="#2E7D5B">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="icon.svg" alt="" width="32" height="32">
      <div>
        <div class="brand-name" data-t="appName">SilverMeal AI</div>
        <div class="brand-sub" id="facilityName"></div>
      </div>
    </div>
    <div class="top-actions">
      <button class="icon-btn" id="langBtn" aria-label="Language">中</button>
      <button class="icon-btn" id="settingsBtn" aria-label="Settings">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M19.4 13a7.5 7.5 0 0 0 0-2l2-1.6-2-3.4-2.4 1a7.4 7.4 0 0 0-1.7-1L15 3.5h-4l-.4 2.5a7.4 7.4 0 0 0-1.7 1l-2.4-1-2 3.4L6.6 11a7.5 7.5 0 0 0 0 2l-2 1.6 2 3.4 2.4-1c.5.4 1.1.7 1.7 1l.4 2.5h4l.4-2.5c.6-.3 1.2-.6 1.7-1l2.4 1 2-3.4zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg>
      </button>
    </div>
  </header>

  <main id="view" tabindex="-1"></main>

  <nav class="tabbar" aria-label="Main">
    <a href="#home" data-route="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v4H4zM4 10.5h16v4H4zM4 16h16v4H4z" fill="currentColor"/></svg><span data-t="nav_home">Stock</span></a>
    <a href="#snap" data-route="snap"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4 7.5 6H4a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1V7a1 1 0 0 0-1-1h-3.5L15 4zm3 4.5a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9z" fill="currentColor"/></svg><span data-t="nav_snap">Snap</span></a>
    <a href="#plan" data-route="plan"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 0 0-9 9h18a9 9 0 0 0-9-9zM2 13.5h20v1.5a3 3 0 0 1-3 3H5a3 3 0 0 1-3-3zM11 1h2v2h-2z" fill="currentColor"/></svg><span data-t="nav_plan">Plan</span></a>
    <a href="#leftover" data-route="leftover"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11h18v2H3zM6 15h12l-1 5H7zM8 4h8v5H8z" fill="currentColor"/></svg><span data-t="nav_leftover">Leftovers</span></a>
    <a href="#report" data-route="report"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10h3v10zm6.5 0V4h3v16zM17 20v-7h3v7z" fill="currentColor"/></svg><span data-t="nav_report">Reports</span></a>
  </nav>

  <dialog id="sheet" class="sheet"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
